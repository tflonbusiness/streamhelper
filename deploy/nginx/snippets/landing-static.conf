# Marketing landing at / — static files live in /usr/share/nginx/html/public/
location = / {
    root /usr/share/nginx/html/public;
    try_files /index.html =404;
}

location = /robots.txt {
    root /usr/share/nginx/html/public;
    default_type text/plain;
}

location = /sitemap.xml {
    root /usr/share/nginx/html/public;
    default_type application/xml;
}

location ~ ^/(logo\.svg|locale\.js|dot-field\.js|og-image\.png|og-image\.svg)$ {
    root /usr/share/nginx/html/public;
    try_files $uri =404;
    add_header X-Robots-Tag "noindex" always;
}
