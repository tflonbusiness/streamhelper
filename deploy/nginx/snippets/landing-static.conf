# Marketing landing — static files in /usr/share/nginx/html/public/
# Included before SPA `location /` in app-proxy.conf.

location = / {
    root /usr/share/nginx/html/public;
    try_files /index.html =404;
}

location = /robots.txt {
    root /usr/share/nginx/html/public;
    default_type text/plain;
}

location = /sitemap.xml {
    root /usr/share/nginx/html/public;
    default_type application/xml;
}

location = /privacy {
    root /usr/share/nginx/html/public;
    try_files /privacy.html =404;
    default_type text/html;
}

location = /terms {
    root /usr/share/nginx/html/public;
    try_files /terms.html =404;
    default_type text/html;
}

location = /legal.css {
    root /usr/share/nginx/html/public;
    try_files /legal.css =404;
    default_type text/css;
}

location = /lang-selector.css {
    root /usr/share/nginx/html/public;
    try_files /lang-selector.css =404;
    default_type text/css;
}

# Landing assets (not separate indexable pages)
location ~ ^/(logo\.svg|locale\.js|dot-field\.js|og-image\.png|og-image\.svg)$ {
    root /usr/share/nginx/html/public;
    try_files $uri =404;
    add_header X-Robots-Tag "noindex" always;
}
