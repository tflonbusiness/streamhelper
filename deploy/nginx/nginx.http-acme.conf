# HTTP only — use until Let's Encrypt certs exist (see docs/https-streamhelper.md).
# Set NGINX_CONFIG=nginx.http-acme.conf in .env.production, then up -d nginx.

upstream api {
    server server:3000;
}

server {
    listen 80;
    server_name streamhelper.best www.streamhelper.best;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/app-proxy.conf;
}
