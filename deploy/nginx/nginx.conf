# HTTPS production — requires certs at /etc/letsencrypt/live/streamhelper.best/
# Set NGINX_CONFIG=nginx.conf in .env.production after certbot (docs/https-streamhelper.md).

upstream api {
    server server:3000;
}

server {
    listen 80;
    server_name streamhelper.best www.streamhelper.best;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name streamhelper.best www.streamhelper.best;

    ssl_certificate /etc/letsencrypt/live/streamhelper.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamhelper.best/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    include /etc/nginx/snippets/app-proxy.conf;
}
