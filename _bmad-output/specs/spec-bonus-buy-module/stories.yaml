- id: "1"
  title: bonus_buy_slot schema and slot REST API
  description: >-
    Add bonus_buy_slot table per bonus-buy-slots.md (is_now_playing,
    is_archived, partial unique index) and nested endpoints GET/POST/PATCH/DELETE
    under accounts/:accountId/bonus-buys/:bonusBuyId/slots. Server computes
    multiplier with decimal.js on win_amount PATCH; DELETE archives row.
  spec_checkpoint: true
  invoke_dev_with: >-
    Add decimal.js to server package if missing. Register routes in
    accounts.controller.ts and DatabaseService methods. E2e tests: create slot,
    partial PATCH win_amount (multiplier), is_now_playing clears siblings,
    DELETE sets is_archived. Reject PATCH on archived rows (404).

- id: "2"
  title: Client slot API and session stats strip
  description: >-
    Extend app/src/api/bonus-buy.ts with BonusBuySlot types and fetch/create/
    patch/archive slot functions. Wire BonusBuySessionPage stats strip to live
    slot data using decimal.js for Spent, Profit, Current balance, Average X
    (CAP-9). Non-archived slots only.
  spec_checkpoint: true
  invoke_dev_with: >-
    Add decimal.js to app package if missing. Shared calc helper in
    app/src/lib/bonus-buy-stats.ts (or similar). Stats refresh after slot
    mutations without full page reload.

- id: "3"
