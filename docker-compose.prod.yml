services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-caz_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Localhost on the VPS only — for TablePlus/DBeaver over SSH (do not expose 0.0.0.0:5432)
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-caz_agent}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-${APP_URL}}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-caz_agent}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      KICK_REDIRECT_URI: ${KICK_REDIRECT_URI:-${APP_URL}/auth/oauth/kick/callback}
      KICK_WEBHOOK_PUBLIC_URL: ${KICK_WEBHOOK_PUBLIC_URL:-${APP_URL}}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - server

volumes:
  postgres_data:
